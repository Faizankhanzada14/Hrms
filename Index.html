<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guard Filters HRMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F6;--card:#fff;--ink:#0B0B0C;--mut:#5B5B66;--line:#E7E7EA;--pri:#D71920;--pi:#fff;--side:#111214;--si:#CBD5E1;--ok:#166534;--okb:#DCFCE7;--wa:#92400E;--wab:#FEF3C7;--in:#1F2937;--inb:#E5E7EB;--bad:#991B1B;--badb:#FEE2E2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C0C0D;--card:#161618;--ink:#F3F4F6;--mut:#A1A1AA;--line:#2A2A2E;--pri:#FF5A5F;--pi:#140404;--side:#0A0A0B;--ok:#86EFAC;--okb:#14351F;--wa:#FCD34D;--wab:#3A2D0B;--in:#E5E7EB;--inb:#2B2C31;--bad:#FCA5A5;--badb:#3F1818}}
:root[data-theme="dark"]{--bg:#0C0C0D;--card:#161618;--ink:#F3F4F6;--mut:#A1A1AA;--line:#2A2A2E;--pri:#FF5A5F;--pi:#140404;--side:#0A0A0B;--ok:#86EFAC;--okb:#14351F;--wa:#FCD34D;--wab:#3A2D0B;--in:#E5E7EB;--inb:#2B2C31;--bad:#FCA5A5;--badb:#3F1818}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}
*{box-sizing:border-box}button{font:inherit;cursor:pointer}
.app{display:flex;min-height:100%}.side{width:232px;background:var(--side);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;font-size:18px;padding:0 10px 22px}.logo i{width:30px;height:30px;border-radius:9px;background:var(--pri);display:block}
.nv{display:flex;gap:12px;align-items:center;padding:11px 12px;border:0;border-radius:10px;background:none;color:var(--si);text-align:left;transition:.15s}.nv:hover{background:#ffffff14}.nv.on{background:var(--pri);color:var(--pi)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;color:var(--si);padding:10px}.me button{margin-left:auto;background:none;border:0;color:var(--si);text-decoration:underline}
.main{flex:1;padding:28px 36px;min-width:0}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:26px;letter-spacing:-.02em}.mu{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.grid{display:grid;gap:16px;margin-bottom:16px}.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.k2{grid-template-columns:2fr 1fr}
.big{font-size:28px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:13px;transition:.15s}.btn:hover{transform:translateY(-1px)}.pri{background:var(--pri);color:var(--pi);border-color:var(--pri)}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}.ok{background:var(--okb);color:var(--ok)}.wa{background:var(--wab);color:var(--wa)}.in{background:var(--inb);color:var(--in)}.bad{background:var(--badb);color:var(--bad)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:13px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--mut);font-weight:600}tr:last-child td{border:0}tbody tr:hover{background:var(--bg)}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--inb);color:var(--in);font-weight:600;font-size:12px;margin-right:10px}
input,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin:6px 0 14px}label{font-weight:600;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:99px;margin-top:12px}.bar div{height:100%;border-radius:99px;background:var(--pri);transition:width .5s}
.ov{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:9;padding:16px}.ov.on{display:grid}.md{background:var(--card);border-radius:18px;padding:26px;width:min(420px,100%);animation:f .2s}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:10}#toast.on{opacity:1}
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}.lp{background:#0B0B0C;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}.lp h2{font-size:42px;line-height:1.12;margin:0 0 14px;letter-spacing:-.02em;max-width:440px}.lf{display:grid;place-items:center;padding:24px}.lf form{width:min(360px,100%)}
.stp{display:flex;gap:6px;align-items:center}.stp i{width:10px;height:10px;border-radius:50%;background:var(--line)}.stp i.d{background:var(--pri)}
@media(max-width:860px){.app{flex-direction:column}.side{width:100%;height:auto;z-index:5;flex-direction:row;overflow-x:auto;padding:10px;gap:6px;align-items:center}.logo,.me .av{display:none}.nv{white-space:nowrap;padding:9px 12px}.me{margin:0 0 0 auto;padding:0;white-space:nowrap}.k2{grid-template-columns:1fr}.main{padding:20px 16px}}@media(max-width:700px){.login{grid-template-columns:1fr}.lp{display:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes gr{from{transform:scaleY(0)}}@keyframes wd{from{width:0}}@keyframes sp3{from{opacity:0;transform:rotate(-140deg) scale(.6)}}@keyframes pop{from{opacity:0;transform:scale(.94)}}@keyframes fl{50%{transform:translate(-24px,28px) scale(1.08)}}@keyframes r{to{transform:rotate(360deg)}}
.an>.hd,.an>.grid>.card,.an>.card,.an>input{animation:up .6s cubic-bezier(.2,.8,.2,1) backwards}
.an>.grid>.card:nth-child(2){animation-delay:.07s}.an>.grid>.card:nth-child(3){animation-delay:.14s}.an>.grid>.card:nth-child(4){animation-delay:.21s}.an>.grid+.grid>.card{animation-delay:.28s}.an>.card:last-child{animation-delay:.36s}
.an tbody tr{animation:up .45s backwards}.an tbody tr:nth-child(2){animation-delay:.06s}.an tbody tr:nth-child(3){animation-delay:.12s}.an tbody tr:nth-child(n+4){animation-delay:.18s}
.an .gb{transform-origin:bottom;animation:gr .8s cubic-bezier(.2,.8,.2,1) backwards}.an .bar div{animation:wd .9s cubic-bezier(.2,.8,.2,1) .3s backwards}.an .dn{animation:sp3 1s cubic-bezier(.2,.8,.2,1) .2s backwards}
.grid>.card{transition:transform .2s,box-shadow .2s}.grid>.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #0f172a1f}.btn:active{transform:scale(.96)}.nv:hover{transform:translateX(3px)}.nv.on:hover{transform:none}
.lp{position:relative;overflow:hidden}.lp>*{position:relative;z-index:1}.lp::before,.lp::after{content:"";position:absolute;border-radius:50%;background:#D71920;opacity:.45;animation:fl 9s ease-in-out infinite}.lp::before{width:380px;height:380px;right:-110px;top:-90px}.lp::after{width:250px;height:250px;left:-70px;bottom:70px;background:#FF5A5F;opacity:.18;animation-delay:-4s}.lf form{animation:up .7s cubic-bezier(.2,.8,.2,1) backwards}
.sp{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:currentColor;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:r .7s linear infinite}
#toast{transform:translate(-50%,16px)}#toast.on{transform:translate(-50%,0)}.ov{backdrop-filter:blur(5px)}.md{animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.logo img{display:block;background:#fff;border-radius:10px;padding:6px 10px;height:52px;width:auto;max-width:100%}.lgi{display:block;background:#fff;border-radius:12px;padding:8px 14px;height:68px;width:auto}.fm{display:none;margin-bottom:22px;border:1px solid var(--line)}@media(max-width:700px){.fm{display:block}}.nv.on{box-shadow:0 6px 16px #d7192055}
</style>
</head>

function cu(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;document.querySelectorAll(".big").forEach(el=>{const n=el.firstChild;if(!n||n.nodeType!=3)return;const m=n.textContent.match(/[\d,]+/);if(!m)return;const to=+m[0].replace(/,/g,""),pre=n.textContent.slice(0,m.index),post=n.textContent.slice(m.index+m[0].length),t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/1000),e=1-Math.pow(1-p,3);n.textContent=pre+Math.round(to*e).toLocaleString()+post;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function render(){const r=$("#root");
if(!S.u){r.innerHTML=`<div class="login"><section class="lp"><div><img class="lgi" src="${LOGO}" alt="Guard Filters"></div><div><h2>Welcome to the <span style="color:#FF5A5F">Guard</span> Family.</h2><p style="color:#D4D4D8;font-size:16px;max-width:420px;margin:0">One place for people, leave, medical claims and provident fund across every Guard Filters site.</p></div><div class="mu" style="color:#A1A1AA">Guard Filters HRMS · Interactive demo with sample data</div></section><section class="lf"><form id="lg"><img class="lgi fm" src="${LOGO}" alt="Guard Filters"><h2 style="font-size:28px;margin:0 0 6px">Welcome back</h2><p class="mu" style="margin:0 0 24px">Sign in to the Guard Family Portal.</p>${fld("Username","u")}<label for="pw">Password</label><input id="pw" type="password" value="demo1234"><button class="btn pri" style="width:100%;padding:14px" type="submit">Sign in</button></form></section></div>`;$("#u").value="admin";return}
r.innerHTML=`<div class="app"><aside class="side"><div class="logo"><img src="${LOGO}" alt="Guard Filters"></div>${N.map(n=>`<button class="nv ${S.p==n[0]?"on":""}" data-a="nav" data-p="${n[0]}">${ic(n[0])}${n[1]}</button>`).join("")}<div class="me"><span class="av" style="margin:0">${ini(S.u)}</span>${S.u}<button data-a="out">Sign out</button></div></aside><main class="main${S.anim?" an":""}">${pg[S.p]()}</main></div>`;if(S.anim){cu();S.anim=0}}
document.addEventListener("submit",e=>{if(e.target.id=="lg"){e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;b.innerHTML='<span class="sp"></span>Signing in';setTimeout(()=>{S.u="Admin";S.anim=1;render();toast("Signed in")},900)}});
document.addEventListener("input",e=>{if(e.target.id=="q"){S.q=e.target.value;$("#tb").innerHTML=rows()}});
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,i=+t.dataset.i,v=id=>$("#"+id).value;
if(a=="nav"){S.p=t.dataset.p;S.anim=1;render();scrollTo(0,0)}
else if(a=="out"){S.u=null;render()}
else if(a=="x"){close()}
else if(a=="addemp"){mf("Add employee",fld("Full name","n")+fld("Department","d",["Production","Quality Control","Supply Chain","Sales and Marketing","Finance","Human Resources","Research"])+fld("Posting unit","pu",["Head Office","Lahore Plant","Karachi Warehouse","Regional Sales Office"]),"se","Save employee")}
else if(a=="se"){if(!v("n").trim())return toast("Enter a name");S.emp.push([v("n"),v("d"),v("pu"),"Probation"]);close();S.p="emp";render();toast("Employee added")}
else if(a=="apply"){mf("Apply for leave",fld("Type","t",["Annual","Casual","Sick"])+fld("Dates","dt")+fld("Days","dy"),"sl","Submit request")}
else if(a=="sl"){S.lv.unshift(["You",v("t"),v("dt")||"TBD",+v("dy")||1,"Pending"]);close();render();toast("Leave request submitted")}
else if(a=="la"||a=="lr"){S.lv[i][4]=a=="la"?"Approved":"Rejected";render();toast(a=="la"?"Leave approved":"Leave rejected")}
else if(a=="claim"){mf("New medical claim",fld("Amount (PKR)","am")+fld("Date","cd"),"sc","Submit claim")}
else if(a=="sc"){S.cl.unshift(["MC-"+(1043+S.cl.length),"You",v("cd")||"Today",+v("am")||1000,"Submitted"]);close();render();toast("Claim submitted to HR")}
else if(a=="ch"){S.cl[i][4]="HR approved";render();toast("Forwarded to Finance")}
else if(a=="cf"){if(S.used+S.cl[i][3]>60000)return toast("Exceeds remaining budget");S.cl[i][4]="Finance approved";S.used+=S.cl[i][3];render();toast("Claim approved by Finance")}
else if(a=="cr"){S.cl[i][4]=S.cl[i][4]=="Submitted"?"HR rejected":"Finance rejected";render();toast("Claim rejected")}
else if(a=="wd"){mf("Request withdrawal",fld("Amount (PKR)","wa"),"sw","Submit request")}
else if(a=="sw"){const x=+v("wa")||0;if(x<=0||x>S.bal)return toast("Enter a valid amount");S.bal-=x;S.led.unshift(["Today","Withdrawal request","-"+x.toLocaleString(),"Pending"]);close();S.p="pf";render();toast("Withdrawal requested")}});
document.addEventListener("keydown",e=>{if(e.key=="Escape")close()});
render();
